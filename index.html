<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Calculator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #fffdf5, #e8cf70);
  font-family: Arial, sans-serif;
}

.calculator {
  width: 360px;
  max-width: 94%;
  padding: 22px;
  background: white;
  border: 2px solid #d4af37;
  border-radius: 28px;
  box-shadow: 0 20px 60px rgba(150, 110, 10, 0.25);
}

.logo {
  text-align: center;
  color: #b18a18;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 4px;
}

.title {
  text-align: center;
  font-size: 27px;
  font-weight: 800;
  margin-top: 6px;
}

.subtitle {
  text-align: center;
  color: #888;
  font-size: 13px;
  margin: 6px 0 20px;
}

.display {
  background: #fffdf5;
  border: 1px solid #dfc45d;
  border-radius: 20px;
  padding: 18px;
  min-height: 105px;
  margin-bottom: 16px;
  text-align: right;
}

.expression {
  color: #a27d12;
  font-size: 17px;
  min-height: 24px;
  word-break: break-all;
}

.result {
  min-height: 38px;
  margin-top: 8px;
  font-size: 30px;
  font-weight: 800;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
}

button {
  height: 57px;
  border-radius: 15px;
  border: 1px solid #e4d49b;
  background: white;
  color: #222;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.94);
}

button:hover {
  background: #fff9e7;
}

.operator {
  background: #fff5cc;
  color: #9b7610;
}

.equal {
  grid-column: span 2;
  background: linear-gradient(135deg, #c49b20, #f0ce55);
  color: white;
  border: none;
}

.clear {
  color: #b32626;
}

.footer {
  text-align: center;
  color: #999;
  font-size: 11px;
  margin-top: 14px;
}

/* POPUP */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(30, 25, 10, 0.6);
  backdrop-filter: blur(6px);
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.overlay.show {
  display: flex;
}

.popup {
  width: 360px;
  max-width: 100%;
  background: white;
  border: 2px solid #d4af37;
  border-radius: 27px;
  padding: 28px;
  text-align: center;
  box-shadow: 0 25px 70px rgba(0,0,0,.3);
}

.lock {
  width: 65px;
  height: 65px;
  margin: auto;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  background: #fff5cf;
  border: 1px solid #d4af37;
  font-size: 28px;
}

.popup h2 {
  margin: 15px 0 5px;
}

.popup p {
  color: #777;
  font-size: 14px;
  line-height: 1.5;
}

.price {
  color: #b18a18;
  font-size: 32px;
  font-weight: 900;
  margin: 18px 0;
}

.pay {
  width: 100%;
  height: 55px;
  background: linear-gradient(135deg, #c49b20, #f0ce55);
  color: white;
  border: none;
}

.close {
  width: 100%;
  height: 45px;
  margin-top: 9px;
  background: white;
  border: 1px solid #ddd;
  font-size: 14px;
}

.warning {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 12px;
  background: #fff0f0;
  color: #c62828;
  font-size: 14px;
  font-weight: bold;
}

.warning.show {
  display: block;
}
</style>
</head>

<body>

<div class="calculator">

  <div class="logo">PREMIUM</div>

  <div class="title">
    Gold Calculator
  </div>

  <div class="subtitle">
    Hasil hanya tersedia setelah pembayaran
  </div>

  <div class="display">
    <div id="expression" class="expression">0</div>

    <!-- HASIL SELALU KOSONG -->
    <div id="result" class="result"></div>
  </div>

  <div class="buttons">

    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="hapus()">⌫</button>
    <button class="operator" onclick="input('/')">÷</button>
    <button class="operator" onclick="input('*')">×</button>

    <button onclick="input('7')">7</button>
    <button onclick="input('8')">8</button>
    <button onclick="input('9')">9</button>
    <button class="operator" onclick="input('-')">−</button>

    <button onclick="input('4')">4</button>
    <button onclick="input('5')">5</button>
    <button onclick="input('6')">6</button>
    <button class="operator" onclick="input('+')">+</button>

    <button onclick="input('1')">1</button>
    <button onclick="input('2')">2</button>
    <button onclick="input('3')">3</button>
    <button onclick="input('.')">.</button>

    <button onclick="input('0')">0</button>

    <button class="equal" onclick="hitung()">
      =
    </button>

  </div>

  <div class="footer">
    Simulasi pembayaran Rp299.000
  </div>

</div>


<!-- POPUP PEMBAYARAN -->

<div id="overlay" class="overlay">

  <div class="popup">

    <div class="lock">🔒</div>

    <h2>Hasil Terkunci</h2>

    <p>
      Hasil perhitungan belum dapat ditampilkan.
      Silakan melakukan pembayaran untuk membuka hasil.
    </p>

    <div class="price">
      Rp299.000
    </div>

    <button class="pay" onclick="bayar()">
      Bayar
    </button>

    <div id="warning" class="warning">
      Anda belum bayar
    </div>

    <button class="close" onclick="tutupPopup()">
      Tutup
    </button>

  </div>

</div>


<script>

let expression = "";


/* INPUT ANGKA / OPERATOR */

function input(value) {

  expression += value;

  document.getElementById("expression").textContent =
    expression || "0";

}


/* HAPUS SEMUA */

function clearDisplay() {

  expression = "";

  document.getElementById("expression").textContent = "0";

  // Hasil tetap kosong
  document.getElementById("result").textContent = "";

}


/* HAPUS SATU KARAKTER */

function hapus() {

  expression = expression.slice(0, -1);

  document.getElementById("expression").textContent =
    expression || "0";

}


/* TOMBOL = */

function hitung() {

  if (expression === "") {
    return;
  }

  document.getElementById("overlay").classList.add("show");

}


/* TOMBOL BAYAR */

function bayar() {

  // Tidak ada pembayaran asli.
  // Hasil TIDAK akan pernah ditampilkan.

  document.getElementById("warning").classList.add("show");

  document.getElementById("result").textContent = "";

}


/* TUTUP POPUP */

function tutupPopup() {

  document.getElementById("overlay").classList.remove("show");

  // Hasil tetap kosong
  document.getElementById("result").textContent = "";

}

</script>

</body>
</html>
